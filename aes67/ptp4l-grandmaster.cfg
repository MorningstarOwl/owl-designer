# owl-node N1: PTPv2 grandmaster for the house's AES67 network (the hub's wired NIC).
# AES67 media profile timing: domain 0, E2E delay, 8 Sync/s, Announce every 2 s.
# priority1 100 beats every follower (255) and the default 128 of any Dante/AES67 gear added later,
# so this box stays the grandmaster while it is up.
# Transport: IEEE 802.3 (L2), not the AES67-default UDPv4. pinode's eth0 is a port of bridge br0, and a
# UDP socket bound to a bridge port never receives (the bridge re-delivers the frame as br0), while the
# hardware timestamps live on eth0. ptp4l's L2 transport reads the port with a raw socket, so it keeps
# hardware timestamps. Both ends must match. Real Dante/AES67 gear expects UDPv4 (see N1 notes in the plan).
[global]
domainNumber            0
priority1               100
priority2               100
clockClass              248
logAnnounceInterval     1
logSyncInterval         -3
logMinDelayReqInterval  -3
announceReceiptTimeout  3
delay_mechanism         E2E
network_transport       L2
time_stamping           hardware
tx_timestamp_timeout    50
summary_interval        3
# pipewire-aes67 reads the grandmaster identity from the read-only management socket (linuxptp >= 4).
uds_ro_address          /var/run/ptp4lro
uds_ro_file_mode        0666

# owl-node N1: PTPv2 follower (clientOnly) for an AES67 satellite on a wired NIC with a PHC.
# ptp4l steers the NIC's hardware clock (/dev/ptpN); pipewire-aes67 reads that PHC directly
# (clock.interface), so the system clock is left to NTP and phc2sys is not needed.
# Transport: IEEE 802.3 (L2), not the AES67-default UDPv4. pinode's eth0 is a port of bridge br0, and a
# UDP socket bound to a bridge port never receives (the bridge re-delivers the frame as br0), while the
# hardware timestamps live on eth0. ptp4l's L2 transport reads the port with a raw socket, so it keeps
# hardware timestamps. Both ends must match. Real Dante/AES67 gear expects UDPv4 (see N1 notes in the plan).
[global]
domainNumber            0
slaveOnly               1
priority1               255
logAnnounceInterval     1
logSyncInterval         -3
logMinDelayReqInterval  -3
announceReceiptTimeout  3
delay_mechanism         E2E
network_transport       L2
time_stamping           hardware
tx_timestamp_timeout    50
summary_interval        3
step_threshold          0.001
first_step_threshold    0.00002

# owl-node: PTPv2 follower that can take over as grandmaster (the default for a node with a PTP hardware clock).
# While the hub's grandmaster (priority1 100) is announcing, the Best Master Clock Algorithm keeps this node a
# follower, exactly like ptp4l-follower.cfg. When the hub goes away (announceReceiptTimeout: 3 missed announces, ~6 s)
# the backups elect one of themselves (priority1 200 here; ties go to the lowest clock identity), so every node keeps
# following ONE clock and their AES67 streams stay aligned instead of each free-running on its own PHC. When the hub
# comes back its priority1 100 wins again and the backups return to following it (a small step/slew of their PHCs).
# ptp4l-follower.cfg (slaveOnly) remains for a node that must never lead (install.sh --ptp follower).
# Transport: IEEE 802.3 (L2), like the hub's grandmaster and the followers; all ends must match (see those files).
[global]
domainNumber            0
priority1               200
priority2               200
clockClass              248
logAnnounceInterval     1
logSyncInterval         -3
logMinDelayReqInterval  -3
announceReceiptTimeout  3
delay_mechanism         E2E
network_transport       L2
time_stamping           hardware
tx_timestamp_timeout    50
summary_interval        3
step_threshold          0.001
first_step_threshold    0.00002

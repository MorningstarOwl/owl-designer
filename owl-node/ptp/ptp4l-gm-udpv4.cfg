# owl-node N2: a SECOND ptp4l instance on the hub, UDPv4 transport, for Dante/AES67 gear (which expects UDPv4).
# It runs beside N1's L2 grandmaster on the same NIC and PHC, so both transports carry the same time:
#   - serverOnly: it never becomes a follower, so it can never steer the PHC the L2 instance distributes
#   - hwts_filter full: asks for PTP_V2_EVENT (L2 + L4) timestamping, so neither instance narrows the NIC's filter
#     for the other (the box's eno1 only offers none/all anyway)
#   - its own UDS paths under /run/timemaster/ (the only extra-instance paths Ubuntu's ptp4l AppArmor profile
#     allows), so pmc / ptpstat keep talking to the L2 instance on the default ones
# Bridged satellites (pinode: eth0 is a port of br0) stay on L2: a UDP socket bound to a bridge port never receives.
[global]
domainNumber            0
serverOnly              1
priority1               100
priority2               101
clockClass              248
logAnnounceInterval     1
logSyncInterval         -3
logMinDelayReqInterval  -3
announceReceiptTimeout  3
delay_mechanism         E2E
network_transport       UDPv4
time_stamping           hardware
hwts_filter             full
tx_timestamp_timeout    50
summary_interval        3
uds_address             /run/timemaster/ptp4l.udpv4.socket
uds_ro_address          /run/timemaster/ptp4lro.udpv4.socket

configuration:
  engine_url:
    name: Engine address
    description: >-
      The machine that runs the owl-node audio engine (installed there with
      `install.sh --hub`), for example 192.0.2.50 or http://192.0.2.50:8362.
  registry_url:
    name: Registry address (optional)
    description: >-
      The NMOS registry for the Routing page. Leave empty: it is the engine
      machine on port 8010.
network:
  8361/tcp: Designer on your network without the Home Assistant login (optional)

name: Feature request
description: Something Owl Designer should do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do in your house?
      description: The situation, not the implementation (e.g. "the kitchen should hear the doorbell over the radio").
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: textarea
    id: hardware
    attributes:
      label: Hardware involved
      description: Devices, Dante/AES67 gear, cameras, displays; whether you could test a change on them.

# Builds the Owl Designer add-on image for amd64 + arm64 and publishes it to GHCR, so Home Assistant pulls a ready
# image (config.yaml `image:`) instead of building the add-on itself.
name: add-on image
on:
  push:
    branches: [main]
    paths: ["owl_designer/**", ".github/workflows/addon-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./owl_designer
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: version from config.yaml (must be plain X.Y.Z with a CHANGELOG entry)
        id: v
        run: |
          v=$(python3 -c 'import yaml; print(yaml.safe_load(open("owl_designer/config.yaml"))["version"])')
          echo "add-on version: $v"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::config.yaml version '$v' is not X.Y.Z (Home Assistant compares versions; no 'v', no suffix)"; exit 1; }
          grep -q "^## $v\b" owl_designer/CHANGELOG.md || { echo "::error::owl_designer/CHANGELOG.md has no '## $v' entry"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./owl_designer
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUILD_FROM=python:3.13-alpine
          tags: |
            ghcr.io/morningstarowl/owl-designer-addon:${{ steps.v.outputs.version }}
            ghcr.io/morningstarowl/owl-designer-addon:latest

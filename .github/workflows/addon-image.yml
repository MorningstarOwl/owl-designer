# Builds the Owl Designer add-on image for amd64 + arm64 and publishes it to GHCR, so Home Assistant pulls a ready
# image (config.yaml `image:`) instead of building the add-on itself. The image is built from the repository root: the
# controller and its pages are copied from owl-node/ (owl_designer/Dockerfile), so a change there rebuilds the add-on.
# HA offers an update only when config.yaml's version changes: bump it (and the CHANGELOG) with every release.
name: add-on image
on:
  push:
    branches: [main]
    paths:
      - "owl_designer/**"
      - "owl-node/owlnode/__init__.py"
      - "owl-node/owlnode/__main__.py"
      - "owl-node/owlnode/controller.py"
      - "owl-node/owlnode/web/**"
      - ".github/workflows/addon-image.yml"
      - ".github/scripts/check-versions.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./owl_designer
  image:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: one version everywhere (X.Y.Z, with a CHANGELOG entry)
        id: v
        run: |
          python3 .github/scripts/check-versions.py
          echo "version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' owl-node/owlnode/__init__.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: owl_designer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUILD_FROM=python:3.13-alpine
          tags: |
            ghcr.io/morningstarowl/owl-designer-addon:${{ steps.v.outputs.version }}
            ghcr.io/morningstarowl/owl-designer-addon:latest
